name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'researchlab' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_password' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'researchlab' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.POSTGRES_USER || 'researchlab' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run linting
        run: |
          cd backend
          source .venv/bin/activate
          ruff check app/ tests/
      - name: Run type checking
        run: |
          cd backend
          source .venv/bin/activate
          mypy app/ --ignore-missing-imports
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_USER || 'researchlab' }}:${{ secrets.POSTGRES_PASSWORD || 'test_password' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'researchlab' }}
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          source .venv/bin/activate
          alembic upgrade head
          pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./backend/coverage.xml

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run linting
        run: cd frontend && npx eslint src/ --ext .ts,.tsx
      - name: Run type checking
        run: cd frontend && npx tsc --noEmit
      - name: Run tests
        run: cd frontend && npx vitest run
      - name: Build
        run: cd frontend && npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start services
        run: docker-compose up -d
      - name: Wait for services
        run: sleep 15
      - name: Run migrations
        run: |
          cd backend
          python -m alembic upgrade head
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          cd ../frontend
          npm run dev -- --port 5173 &
          sleep 5
          npx playwright test
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/playwright-report/